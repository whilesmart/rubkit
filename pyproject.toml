[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rubkit"
version = "0.2.0"
description = "Portable rubric evaluation with deterministic scoring"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "WhileSmart"}]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.urls]
Homepage = "https://github.com/whilesmart/rubkit"
Repository = "https://github.com/whilesmart/rubkit"
Issues = "https://github.com/whilesmart/rubkit/issues"

[project.optional-dependencies]
llm = ["litellm>=1.106.6,<2"]
dev = ["pytest>=8", "ruff>=0.12", "build>=1", "setuptools>=77", "wheel"]

[project.scripts]
rubkit = "rubkit.cli:main"

[tool.setuptools.package-data]
rubkit = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
